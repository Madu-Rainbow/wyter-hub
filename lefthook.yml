pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,jsx,tsx,json,css}"
      run: pnpm biome check --write {staged_files} && git add {staged_files}

    - name: typecheck
      run: pnpm tsc --noEmit

    - name: gitleaks
      run: gitleaks git --pre-commit --no-banner

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}

pre-push:
  jobs:
    - name: tests
      run: pnpm test
